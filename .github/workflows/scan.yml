name: commodity-scan
on:
  schedule:
    - cron: "7 0,6,12,18 * * 0-5"   # live 24/5: four ~6h runs chain back-to-back (Sun 6pm → Fri 5pm ET)
    - cron: "40 12 * * 1-5"    # morning brief ~7:40 ET
    - cron: "50 18 * * 1-5"    # afternoon brief ~1:50 ET
    - cron: "30 21 * * 1-5"    # daily re-optimize after the close
  workflow_dispatch:
    inputs:
      cmd: {description: "live | scan | brief | optimize | doctor | testnotify", default: live}
permissions: {contents: write}
concurrency:
  group: swing-${{ github.event.schedule == '7 0,6,12,18 * * 0-5' || inputs.cmd == 'live' }}
  cancel-in-progress: ${{ github.event.schedule == '7 0,6,12,18 * * 0-5' || inputs.cmd == 'live' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt && git config user.name bot && git config user.email bot@users.noreply.github.com
      - run: python swing_alert.py "$CMD"
        env:
          CMD: ${{ inputs.cmd || (github.event.schedule == '30 21 * * 1-5' && 'optimize') || (github.event.schedule == '7 0,6,12,18 * * 0-5' && 'live') || 'brief' }}
          LIVE_MAX_MIN: "352"
          PYTHONUNBUFFERED: "1"
          GIT_PERSIST: "1"
          PULSE_MIN: ${{ vars.PULSE_MIN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          EXTRA_EVENTS: ${{ vars.EXTRA_EVENTS }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
      - name: save state
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A state.json params.json calls.jsonl preds.jsonl 2>/dev/null || true
          git commit -qm "bot: update state" || exit 0
          git pull -q --rebase origin main && git push -q
