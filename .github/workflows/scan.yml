name: commodity-scan
on:
  schedule: [{cron: "5,35 * * * 0-5"}]   # every 30 min, Sun-Fri (futures hours)
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python swing_alert.py scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EXTRA_EVENTS: ${{ vars.EXTRA_EVENTS }}
      - name: persist state (open signals / dedupe)
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add state.json; git commit -m "state" || exit 0; git push
